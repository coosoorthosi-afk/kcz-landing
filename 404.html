<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — KCZ AI System</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:#06060a;}
  a{color:#c9884f;text-decoration:none;}
  a:hover{color:#e0a56b;}
  @keyframes kczBlink{0%,48%{opacity:1;}49%,100%{opacity:0;}}
  .kcz-num{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(140px,26vw,300px);line-height:.82;
    letter-spacing:-.06em;margin:0;
    color:#c9884f;
    user-select:none;
  }
  .kcz-caret{display:inline-block;width:2px;height:1em;background:#c9884f;vertical-align:-.14em;margin-left:4px;animation:kczBlink 1.1s steps(1) infinite;}
  @media (prefers-reduced-motion:reduce){.kcz-caret{animation:none;}}
</style>
</head>
<body>
<div style="min-height:100vh;background:#06060a;color:#f4f1ea;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:relative;overflow:hidden;">

  <div style="position:absolute;inset:0;background:radial-gradient(58% 62% at 50% 44%, rgba(154,139,255,.07), transparent 72%);pointer-events:none;"></div>

  <div style="position:relative;z-index:2;border-bottom:1px solid rgba(255,255,255,.07);">
    <div style="max-width:1200px;margin:0 auto;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;">
      <a href="/" style="display:block;line-height:0;flex:none;"><img src="assets/brand/logo.png" alt="KCZ" style="height:20px;width:auto;display:block;"></a>
      <span style="font:400 11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#57525f;">404 · not found</span>
    </div>
  </div>

  <div style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:64px 32px 72px;">
    <div style="max-width:640px;width:100%;text-align:center;">

      <div class="kcz-num">404</div>

      <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 30px;">
        <span style="height:1px;width:44px;background:linear-gradient(90deg,transparent,rgba(201,136,79,.55));"></span>
        <span style="font:400 12.5px 'JetBrains Mono',ui-monospace,monospace;color:#8a8492;white-space:nowrap;">no output for this prompt<span class="kcz-caret"></span></span>
        <span style="height:1px;width:44px;background:linear-gradient(270deg,transparent,rgba(201,136,79,.55));"></span>
      </div>

      <h1 style="font-weight:700;font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 11px;">This page does not exist.</h1>
      <p style="font:400 15px 'Manrope';line-height:1.6;color:#9a94a6;margin:0 auto 34px;max-width:40ch;">Broken link, or the page moved. The course has not.</p>

      <a href="/" style="display:inline-flex;align-items:center;justify-content:center;padding:19px 46px;border-radius:100px;background:#ede9e2;color:#08080a;box-shadow:0 0 0 1px rgba(237,233,226,.5), 0 8px 24px rgba(237,233,226,.16), 0 0 40px rgba(237,233,226,.1);font:700 17px 'Manrope';">Back to the course</a>

    </div>
  </div>

  <div style="position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.07);">
    <div style="max-width:1200px;margin:0 auto;padding:18px 40px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;">
      <a href="/terms" style="font:400 12px 'Manrope';color:#6f6a76;">Terms of Service</a>
      <a href="/refund-policy" style="font:400 12px 'Manrope';color:#6f6a76;">Refund Policy</a>
      <a href="/legal" style="font:400 12px 'Manrope';color:#6f6a76;">Privacy &amp; Earnings Disclaimer</a>
      <span style="font:400 12px 'Manrope';color:#46424d;margin-left:auto;">© 2026 KCZ · Èric Cosor</span>
    </div>
  </div>

</div>
</body>
</html>
